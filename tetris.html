<section id="Tetris">
  <div>
    <h1><font color="lime">Play Tetris</font></h1>
    <canvas id="tetris" width="240" height="400" style="background:#111;border-radius:8px;"></canvas>
    <p>Score: <span id="score">0</span></p>
    <p>Interval (milleseconds): <span id="tetris-speed">600</span>
    <p style="color:#1aff00">Controls: ←, →, ↓, Space to rotate</p>
<button id="enable-onscreen-btn"
  style="position:fixed;bottom:20px;left:20px;z-index:10;padding:10px 12px;font-size:15px;background:#ffff00;color:#000;border:none;border-radius:5px;cursor:pointer;display:inline-block;">
  Enable On-Screen Buttons</button>
<button id="disable-onscreen-btn"
  style="position:fixed;bottom:20px;left:20px;z-index:10;padding:10px 12px;font-size:15px;background:#ffff00;color:#000;border:none;border-radius:5px;cursor:pointer;display:none;">
  Disable On-Screen Buttons</button>
<div id="tetris-onscreen-controls"
  style="position:fixed;bottom:65px;left:20px;z-index:9;display:none;flex-direction:column;background:transparent;padding:0;">
  <div style="display:flex;gap:2px;">
    <button onclick="tetrisControl('left')" style="width:48px;height:48px;margin:0;">⬅️</button>
    <button onclick="tetrisControl('down')" style="width:48px;height:48px;margin:0;">⬇️</button>
    <button onclick="tetrisControl('right')" style="width:48px;height:48px;margin:0;">➡️</button>
  </div>
  <button onclick="tetrisControl('rotate')" style="margin-top:3px;width:153px;height:48px;">🔄 Rotate</button>
</div>
  </div>
</section>
