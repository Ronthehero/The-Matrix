<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link id="favicon" rel="icon" type="image/png" href="/favicons/favicon-on.png">
<script>
  const _fav = document.getElementById("favicon");
  const _frames = ["/favicons/favicon-on.png", "/favicons/favicon-off.png"];
  let _fi = 0;
  setInterval(() => { _fi = (_fi + 1) % 2; _fav.href = _frames[_fi]; }, 530);
</script>
<title>The Matrix — Mind Map</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  canvas#rain {
    position: fixed;
    top: 0; left: 0;
    z-index: 0;
    opacity: 0.18;
  }

  svg#mindmap {
    position: relative;
    z-index: 2;
    width: 100vw;
    height: 100vh;
  }

  .center-node {
    filter: drop-shadow(0 0 18px #00ff41) drop-shadow(0 0 40px #00ff41);
  }

  .branch-node {
    filter: drop-shadow(0 0 8px #00cc33);
    cursor: pointer;
    transition: filter 0.2s;
  }

  .branch-node:hover {
    filter: drop-shadow(0 0 18px #00ff88) drop-shadow(0 0 30px #00ff41);
  }

  .leaf-node {
    filter: drop-shadow(0 0 4px #009922);
    cursor: pointer;
  }

  .leaf-node:hover {
    filter: drop-shadow(0 0 10px #00ff88);
  }

  .edge {
    stroke: #00ff41;
    stroke-width: 1.5;
    fill: none;
    opacity: 0.5;
    stroke-dasharray: 6 4;
    animation: dash 2s linear infinite;
  }

  .edge-leaf {
    stroke: #006622;
    stroke-width: 1;
    fill: none;
    opacity: 0.4;
  }

  @keyframes dash {
    to { stroke-dashoffset: -20; }
  }

  .label-center {
    font-family: 'Orbitron', monospace;
    font-size: 15px;
    font-weight: 900;
    fill: #00ff41;
    text-anchor: middle;
    dominant-baseline: middle;
    letter-spacing: 2px;
  }

  .label-branch {
    font-family: 'Orbitron', monospace;
    font-size: 9.5px;
    font-weight: 700;
    fill: #00ff88;
    text-anchor: middle;
    dominant-baseline: middle;
    letter-spacing: 1px;
  }

  .label-leaf {
    font-family: 'Share Tech Mono', monospace;
    font-size: 8.5px;
    fill: #44ff88;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .pulse {
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  .scan {
    animation: scan 3s ease-in-out infinite;
  }

  @keyframes scan {
    0%, 100% { r: 48; opacity: 1; }
    50% { r: 54; opacity: 0.7; }
  }

  #tooltip {
    position: fixed;
    background: rgba(0,20,0,0.92);
    border: 1px solid #00ff41;
    color: #00ff41;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 3px;
    pointer-events: none;
    display: none;
    z-index: 10;
    box-shadow: 0 0 10px #00ff41;
  }
</style>
</head>

<script>
// Matrix rain
const canvas = document.getElementById('rain');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const cols = Math.floor(canvas.width / 16);
const drops = Array(cols).fill(1);
function drawRain() {
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#00ff41';
  ctx.font = '14px Share Tech Mono';
  for (let i = 0; i < drops.length; i++) {
    const char = String.fromCharCode(0x30A0 + Math.random() * 96);
    ctx.fillText(char, i * 16, drops[i] * 16);
    if (drops[i] * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(drawRain, 40);
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

// Tooltip
const tooltip = document.getElementById('tooltip');
document.querySelectorAll('.branch-node').forEach(node => {
  node.addEventListener('mouseenter', e => {
    tooltip.textContent = node.dataset.tip;
    tooltip.style.display = 'block';
  });
  node.addEventListener('mousemove', e => {
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY - 28) + 'px';
  });
  node.addEventListener('mouseleave', () => {
    tooltip.style.display = 'none';
  });
});
</script>
</body>
</html>
