<!DOCTYPE html>
<html lang="en">  
<head>  
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tetris</title>    
<link id="favicon" rel="icon" type="image/png" href="../favicons/favicon-on.png">
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../CSS/tetris.css">
</head>  
<body>  
<video autoplay muted loop playsinline id="bg-video"
    style="position:fixed; top:0; left:0; min-width:100vw; min-height:100vh; object-fit:cover; z-index:-1;">
  <source src="../Digital-Matrix.mp4" type="video/mp4">
  Your browser does not support the video tag.
</video>
<audio id="bg-music" loop style="display:none">
  Your browser does not support the audio element.
</audio>
<button 
  id="play-music-btn"
  onclick="playMusic()"
  style="position:fixed;bottom:20px;right:20px;padding:10px 15px;background:#1aff00;color:#000;border:none;border-radius:5px;cursor:pointer;z-index:10;font-weight:bold;font-size:16px;"
>
  ▶ Play Music
</button>
<button 
  id="pause-music-btn"
  onclick="pauseMusic()"
  style="position:fixed;bottom:20px;right:20px;padding:10px 15px;background:#ff0000;color:#fff;border:none;border-radius:5px;cursor:pointer;z-index:10;font-weight:bold;font-size:16px;display:none;"
>
  ❚❚ Pause Music
</button>
<select id="music-select" style="position:fixed;bottom:60px;right:20px;z-index:13;padding:7px 10px;font-size:15px;background:#222;color:#1aff00;border-radius:5px;border:none;">
  <option value="../Music/Highscore.mp3">Highscore</option>
  <option value="../Music/Lost-in-Sound.mp3">Lost in Sound</option>
  <option value="../Music/Never-Be-Alone.mp3">Never Be Alone</option>
  <option value="../Music/Dr.-Gaster.mp3">Dr. Gaster</option>
  <option value="../Music/Link.mp3">Link</option>
  <option value="../Music/Sky-High.mp3">Sky High</option>
  <option value="../Music/Sky-High-pt.-II.mp3">Sky High pt.II</option>
  <option value="../Music/Symbolism.mp3">Symbolism</option>
  <option value="../Music/Dreams.mp3">Dreams</option>
  <option value="../Music/Fearless.mp3">Fearless</option>
  <option value="../Music/Force.mp3">Force</option>
  <option value="../Music/Fearless-pt.-II.mp3">Fearless pt. II</option>
  <option value="../Music/Invisible.mp3">Invisible</option>
  <option value="../Music/Invincible.mp3">Invincible</option>
  <option value="../Music/Where-We-Started.mp3">Where We Started</option>
  <option value="../Music/Battle-Against-A-True-Hero.mp3">Battle Against A True Hero</option>
  <option value="../Music/12am.mp3">12am</option>
  <option value="../Music/Creative-Freedom.mp3">Creative Freedom</option>
  <option value="../Music/A-DARK-ZONE.mp3">A DARK ZONE</option>
  <option value="../Music/TV-World.mp3">TV World</option>
  <option value="../Music/Glowing-Snow.mp3">Glowing Snow</option>
  <option value="../Music/Its-TV-Time.mp3">It's TV Time!</option>
  <option value="../Music/Raise-Up-Your-Bat.mp3">Raise Up Your Bat</option>
  <option value="../Music/THE-WORLD-REVOLVING.mp3">THE WORLD REVOLVING</option>
  <option value="../Music/Chaos-King.mp3">Chaos King</option>
  <option value="../Music/Black-Knife.mp3">Black Knife</option>
  <option value="../Music/Dialtone.mp3">Dialtone</option>
  <option value="../Music/Hammer-of-Justice.mp3">Hammer of Justice</option>
  <option value="../Music/Think-Different.mp3">Think Different</option>
  <option value="../Music/Dragonfly.mp3">Dragonfly</option>
  <option value="../Music/Born-Survivor.mp3">Born Survivor</option>
  <option value="../Music/Granite.mp3">Granite</option>
  <option value="../Music/Spider-Dance.mp3">Spider Dance</option>
  <option value="../Music/Final-Boss.mp3">Final Boss</option>
  <option value="../Music/Till-Its-Over.mp3">Till Its Over</option>
  <option value="../Music/Grape-Soda.mp3">Grape Soda</option>
  <option value="../Music/Hell-Finds-You-Everywhere.mp3">Hell Finds You Everywhere</option>
  <option value="../Music/Scoring-The-End-Of-The-World.mp3">Scoring The End of The World</option>
  <option value="../Music/Cause-of-Death.mp3">Cause of Death</option>
  <option value="../Music/Black-Catcher.mp3">Black Catcher</option>
  <option value="../Music/Unravel.mp3">Unravel</option>
  <option value="../Music/Kizuna-No-Kiseki.mp3">Kizuna No Kiseki</option>
  <option value="../Music/Usseewa.mp3">Usseewa</option>
  <option value="../Music/Usseewa-(Giga-Remix).mp3">Usseewa (Giga Remix)</option>
  <option value="../Music/secret_audio.mp3">secret_audio.mp3</option>
</select>

<span id="music-width-mirror"
  style="position:absolute;visibility:hidden;white-space:pre;font-size:15px;font-family:inherit;"></span>

<section id="Tetris">
  <div>
    <h1><font color="lime">Play Tetris</font></h1>
    <canvas id="tetris" width="240" height="400" style="background:#111;border-radius:8px;width:240px;height:400px;max-width:240px;flex-shrink:0;display:block;"></canvas>
    <p>Score: <span id="score">0</span></p>
    <p>Interval (milleseconds): <span id="tetris-speed">600</span></p>
    <p style="color:#1aff00">Controls: ←, →, ↓, Space to rotate</p>
<button id="enable-onscreen-btn">Enable On-Screen Buttons</button>
<button id="disable-onscreen-btn">Disable On-Screen Buttons</button>
<div id="tetris-onscreen-controls">
  <div id="tetris-dpad">
    <button onclick="tetrisControl('left')">⬅️</button>
    <button onclick="tetrisControl('down')">⬇️</button>
    <button onclick="tetrisControl('right')">➡️</button>
  </div>
  <button id="tetris-rotate-btn" onclick="tetrisControl('rotate')">🔄 Rotate</button>
</div>
  </div>
</section>
<script src="../JS/tetris.js"></script>
<script src="../JS/musicselect.js"></script>
<script src="../JS/favicon.js"></script>
</body>
</html>
